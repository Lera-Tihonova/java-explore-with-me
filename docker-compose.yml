services:
  stats-db:
    image: postgres:15-alpine
    container_name: stats-db
    environment:
      - POSTGRES_DB=explore-with-me-stats
      - POSTGRES_USER=stats
      - POSTGRES_PASSWORD=stats
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d explore-with-me-stats"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    restart: always

  main-db:
    image: postgres:15-alpine
    container_name: main-db
    environment:
      - POSTGRES_DB=explore-with-me-main
      - POSTGRES_USER=main
      - POSTGRES_PASSWORD=main
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main -d explore-with-me-main"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - main-db-data:/var/lib/postgresql/data
    restart: always

  stats-server:
    build: stats/stats-server
    container_name: stats-server
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/explore-with-me-stats
      - SPRING_DATASOURCE_USERNAME=stats
      - SPRING_DATASOURCE_PASSWORD=stats
    restart: always

  main-service:
    build: main-service
    container_name: main-service
    ports:
      - "8080:8080"
    depends_on:
      main-db:
        condition: service_healthy
      stats-server:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://main-db:5432/explore-with-me-main
      - SPRING_DATASOURCE_USERNAME=main
      - SPRING_DATASOURCE_PASSWORD=main
      - STATS_SERVER_URL=http://stats-server:9090
    restart: always

volumes:
  stats-db-data:
  main-db-data: