spring.application.name=main-service
server.port=8080

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://main-db:5432/ewm
spring.datasource.username=root
spring.datasource.password=root

# JPA - ВКЛЮЧАЕМ auto-create (без schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Schema initialization - ОТКЛЮЧАЕМ schema.sql
spring.sql.init.mode=never

# Stats Server URL
stats-server.url=http://stats-server:9090

# Logging
logging.level.ru.practicum=DEBUG